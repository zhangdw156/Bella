[project]
name = "bella"
version = "0.1.0.dev0"
description = "LLM agent evaluation framework"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "openai",
]

[project.optional-dependencies]
dev = [
    "python-dotenv",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bella"]
